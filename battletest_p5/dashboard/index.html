<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tc_r1 Phase 5 Mission Control</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0969da;--pass:#166534;--warn:#92400e;--fail:#991b1b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
main{padding:24px 28px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}.metric{font-size:26px;font-weight:700}
.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.pass{background:#f0fdf4;color:var(--pass);border:1px solid #bbf7d0}.warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}.fail{background:#fef2f2;color:var(--fail);border:1px solid #fecaca}
table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);text-transform:uppercase}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto;max-height:340px;font-size:12px}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
section{margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:900px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>tc_r1 Phase 5 Mission Control</h1><div class="muted" id="activity">Loading…</div></div><div id="status" class="pill warn">…</div></header>
<main>
<section class="grid" id="metrics"></section>
<section class="card"><h2>Tiers</h2><table><thead><tr><th>Tier</th><th>Name</th><th>Progress</th><th>Status</th><th>Bugs</th></tr></thead><tbody id="tiers"></tbody></table></section>
<div class="row"><section class="card"><h2>Fuzz Budget</h2><div id="fuzz"></div></section><section class="card"><h2>Bugs</h2><div id="bugs"></div></section></div>
<div class="row"><section class="card"><h2>Recent Programs</h2><pre id="programs"></pre></section><section class="card"><h2>Journal</h2><pre id="journal"></pre></section></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function get(url){const r=await fetch(url);return r.json()}
function pill(status){const s=(status||'').toLowerCase();const c=s==='done'||s==='completed'||s==='pass'?'pass':s==='failed'||s==='fail'?'fail':'warn';return `<span class="pill ${c}">${status||'PENDING'}</span>`}
async function refresh(){
 try{
  const s=await get('/api/state');const m=s.metrics||{};
  $('activity').textContent=`${s.current_tier||''} · ${s.current_activity||''}`;
  $('status').className='pill '+(s.status==='COMPLETED'?'pass':s.status==='RUNNING'?'warn':'fail');
  $('status').textContent=s.status||'?';
  const items=[['Tiers',`${m.tiers_completed||0}/${m.tiers_total||12}`],['Programs',`${m.programs_tested||0}/${m.programs_target||550}`],['Fuzz',`${(m.fuzz_fullstack_done||0)+(m.fuzz_paraphrase_done||0)+(m.fuzz_prose_done||0)+(m.fuzz_crash_done||0)}/5000`],['Bugs open',m.bugs_open||0],['Leaks',m.memory_leaks_open||0],['Silent drops',m.silent_drops_open||0],['Regressions',m.regression_tests||650],['Commits',m.commits_on_branch||0]];
  $('metrics').innerHTML=items.map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${v}</div></div>`).join('');
  $('tiers').innerHTML=(s.tiers||[]).map(t=>{const pct=t.target?Math.min(100,100*(t.tested||0)/t.target):0;return `<tr><td><b>${t.id}</b></td><td>${t.name}</td><td style="min-width:140px"><div class="bar"><i style="width:${pct}%"></i></div><span class="muted">${t.tested||0}/${t.target}</span></td><td>${pill(t.status)}</td><td>${t.bugs||0}</td></tr>`}).join('');
  const fz=[['Full-stack',m.fuzz_fullstack_done,m.fuzz_fullstack_target],['Paraphrase',m.fuzz_paraphrase_done,m.fuzz_paraphrase_target],['Prose',m.fuzz_prose_done,m.fuzz_prose_target],['Crash',m.fuzz_crash_done,m.fuzz_crash_target]];
  $('fuzz').innerHTML=fz.map(([k,v,t])=>`<div style="margin:8px 0"><div class="muted">${k}: ${v||0}/${t}</div><div class="bar"><i style="width:${Math.min(100,100*(v||0)/t)}%"></i></div></div>`).join('');
  const bugs=await get('/api/bugs');$('bugs').innerHTML=bugs.length?bugs.slice(-8).reverse().map(b=>`<div>${pill(b.status)} <b>${b.id}</b> ${b.title||b.class||''}</div>`).join(''):'<span class="pass pill">0 open</span>';
  const p=await get('/api/programs?limit=30');$('programs').textContent=p.map(x=>`${x.tier||''} ${x.program||''} ${x.status||''}`).join('\n')||'none yet';
  const j=await get('/api/journal?tail=40');$('journal').textContent=j.join('\n')||'none yet';
 }catch(e){$('status').textContent='offline';$('status').className='pill fail'}
}
refresh();setInterval(refresh,2000);
</script>
</body></html>
