<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R1 Editor GUI</title>
<style>
:root{
  --bg:#161922;--panel:#1c202b;--bar:#12151e;--line:#242a3a;--border:#384056;
  --focus:#7aa2f7;--text:#d8deee;--muted:#5c6686;--gold:#e0af68;--violet:#bb9af7;
  --cyan:#7dcfff;--teal:#2ac3de;--green:#73daca;--red:#f7768e;--orange:#ff9e64;
}
body.light{--bg:#f6f7fb;--panel:#ffffff;--bar:#eef1f8;--line:#e3e7f2;--border:#c4ccdf;--focus:#2563eb;--text:#1d2433;--muted:#6b748c;--gold:#9a5b00;--violet:#7c3aed;--cyan:#0369a1;--teal:#0f766e;--green:#047857;--red:#b91c1c;--orange:#c2410c;}
body.contrast{--bg:#000;--panel:#000;--bar:#000;--line:#222;--border:#999;--focus:#00e0ff;--text:#fff;--muted:#bbb;--gold:#ffff00;--violet:#ff60ff;--cyan:#00ffff;--teal:#50ff78;--green:#00ff50;--red:#ff2828;--orange:#ffa000;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:700;color:var(--focus);letter-spacing:.4px}
.filename{padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.dirty{color:var(--gold)}
.clean{color:var(--green)}
.spacer{flex:1}
button,select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--focus)}
button.primary{background:var(--focus);border-color:var(--focus);color:#081018;font-weight:700}
kbd{font-size:11px;opacity:.7;margin-left:4px}
.workspace{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) minmax(320px,42%);min-height:0}
aside.sidebar{background:var(--bar);border-right:1px solid var(--border);padding:10px;overflow:auto}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:12px 0 6px}
.file-list,.preset-list{display:flex;flex-direction:column;gap:4px}
.file-item{padding:5px 7px;border-radius:6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item:hover{background:var(--panel)}
.preset-item{padding:5px 7px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
.preset-item:hover{color:var(--text);background:var(--panel)}
main.editor-pane{position:relative;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.editor-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
#highlight,#editor{position:absolute;inset:0;margin:0;padding:14px 16px;font:inherit;line-height:1.5;tab-size:4;white-space:pre;overflow:auto}
#highlight{pointer-events:none;color:var(--text)}
#editor{background:transparent;color:transparent;caret-color:var(--text);border:0;resize:none;outline:none}
#editor::selection{background:rgba(122,162,247,.32)}
.stdin-bar{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--border);background:var(--bar)}
.stdin-bar input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font:inherit}
section.output-pane{display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.tabs{display:flex;gap:4px;padding:7px;background:var(--bar);border-bottom:1px solid var(--border);overflow:auto}
.tab{padding:5px 8px;border-radius:6px;border:0;background:transparent;color:var(--muted)}
.tab.active{background:var(--line);color:var(--text);font-weight:700}
.banner{margin:8px 10px;padding:7px 10px;border-radius:7px;background:var(--bar);border:1px solid var(--border)}
.banner.pass{border-color:var(--green);color:var(--green)}
.banner.fail{border-color:var(--red);color:var(--red)}
.output{flex:1;overflow:auto;padding:2px 12px 14px;white-space:pre-wrap;word-break:break-word;min-height:0}
.line{min-height:1.45em}
.kind-control{color:var(--violet);font-weight:700}.kind-verb{color:var(--cyan)}.kind-anaphor{color:var(--teal);font-weight:700}
.kind-type{color:var(--gold)}.kind-number{color:var(--orange)}.kind-string{color:var(--green)}
.kind-operator{color:var(--cyan)}.kind-muted{color:var(--muted)}.kind-prose{color:var(--muted);font-style:italic;opacity:.85}
.kind-error{color:var(--red)}.kind-search{background:var(--gold);color:#111}
.badge{display:inline-block;border-radius:999px;padding:1px 7px;background:var(--line);color:var(--teal);font-weight:700}
.badge.omit{color:var(--muted);font-style:italic}.badge.err{color:var(--red)}.badge.ok{color:var(--green)}
footer{display:flex;gap:14px;align-items:center;padding:5px 12px;background:var(--bar);border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100%;background:var(--panel);border-left:1px solid var(--focus);transition:right .18s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer header{background:var(--bar)}
.drawer .body{overflow:auto;padding:12px}
.std-module{margin-bottom:14px}.std-module h3{margin:0 0 4px;color:var(--gold);font-size:13px}
.std-fn{margin:3px 0;color:var(--text);font-size:12px}.std-phrase{color:var(--teal);font-size:11px;margin-left:12px}
.empty{color:var(--muted);font-style:italic}
@media(max-width:980px){.workspace{grid-template-columns:180px minmax(0,1fr)}section.output-pane{grid-column:1/-1;min-height:36vh}aside.sidebar{grid-row:1}}
</style>
</head>
<body class="midnight">
<header>
  <span class="brand">◆ R1 Editor</span>
  <span class="filename"><span id="filename">untitled.eng</span><span id="dirty" class="clean"> ✓</span></span>
  <button class="primary" id="run">▶ Run <kbd>Ctrl+Enter</kbd></button>
  <button id="paraphrase">Paraphrase <kbd>Alt+P</kbd></button>
  <button id="trace">Trace <kbd>Alt+T</kbd></button>
  <button id="ir">Core-7 IR <kbd>Alt+I</kbd></button>
  <button id="build">Build .elf <kbd>Ctrl+B</kbd></button>
  <button id="save">Save <kbd>Ctrl+S</kbd></button>
  <button id="new">New</button>
  <select id="preset-select"><option value="">Presets…</option></select>
  <button id="std-toggle">std/ Docs</button>
  <button id="theme">Theme: Midnight</button>
</header>
<div class="workspace">
  <aside class="sidebar">
    <div class="section-title">Workspace .eng</div>
    <button id="refresh-files">Refresh</button>
    <button id="new-file">+ New .eng</button>
    <div id="file-list" class="file-list"></div>
    <div class="section-title">Phase 4 Presets</div>
    <div id="preset-list" class="preset-list"></div>
  </aside>
  <main class="editor-pane">
    <div class="editor-wrap">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
    </div>
    <div class="stdin-bar"><span>stdin</span><input id="stdin" placeholder="optional program input"></div>
  </main>
  <section class="output-pane">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="run">Run &amp; Parity</button>
      <button class="tab" data-tab="paraphrase">Paraphrase</button>
      <button class="tab" data-tab="trace">Trace</button>
      <button class="tab" data-tab="ir">Core-7 IR</button>
      <button class="tab" data-tab="build">Build .elf</button>
    </div>
    <div id="banner" class="banner">Ready</div>
    <pre id="output" class="output"></pre>
  </section>
</div>
<footer>
  <span id="position">Ln 1, Col 1</span><span id="lines">1 line</span><span>.eng</span>
  <span>Static Zero-Libc x86_64</span><span>Offline Rust</span><span class="spacer"></span><span id="status">Ready</span>
</footer>
<div id="drawer" class="drawer">
  <header><strong>std/ Reference</strong><span class="spacer"></span><button id="std-close">Close</button></header>
  <div class="body" id="std-body"></div>
</div>
<script>
const el = id => document.getElementById(id);
const state = { path: null, dirty: false, tab: "run", theme: 0, presets: [], results: {}, errorLines: [], omittedLines: [], highlightTimer: 0 };
const themes = ["midnight", "light", "contrast"];
const themeNames = ["Midnight", "Clean Light", "High Contrast"];

async function getJson(path) {
  const response = await fetch(path);
  return await response.json();
}
async function postJson(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return await response.json();
}
function escapeHtml(text) {
  return String(text).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}
function setStatus(text) { el("status").textContent = text; }
function markDirty(dirty) {
  state.dirty = dirty;
  el("dirty").textContent = dirty ? " ●" : " ✓";
  el("dirty").className = dirty ? "dirty" : "clean";
}
function setPath(path) {
  state.path = path;
  el("filename").textContent = path ? path.split("/").pop() : "untitled.eng";
}
function updatePosition() {
  const text = el("editor").value.slice(0, el("editor").selectionStart);
  const rows = text.split("\n");
  el("position").textContent = `Ln ${rows.length}, Col ${rows[rows.length - 1].length + 1}`;
  el("lines").textContent = `${el("editor").value.split("\n").length} line${el("editor").value.split("\n").length === 1 ? "" : "s"}`;
}
function applyHighlight(spans) {
  el("highlight").innerHTML = spans.map(spansForLine => spansForLine.map(span =>
    `<span class="kind-${span.kind}">${escapeHtml(span.text)}</span>`).join("")).join("\n");
  el("highlight").scrollTop = el("editor").scrollTop;
  el("highlight").scrollLeft = el("editor").scrollLeft;
}
async function highlightNow() {
  const source = el("editor").value;
  try {
    const data = await postJson("/api/highlight", { source, error_lines: state.errorLines, omitted_lines: state.omittedLines });
    if (data.lines) applyHighlight(data.lines);
  } catch (_) {}
}
function scheduleHighlight() {
  clearTimeout(state.highlightTimer);
  state.highlightTimer = setTimeout(highlightNow, 80);
}
function renderOutput(text, kind) {
  return text.map(line => `<div class="line">${colorLine(line, kind)}</div>`).join("");
}
function colorLine(line, kind) {
  let safe = escapeHtml(line);
  if (kind === "paraphrase") {
    safe = safe.replaceAll(/(\[L\d+\]|\[OMITTED:[^\]]*\]|\[it [^\]]*\]|\[its [^\]]*\]|\[the [^\]]*\]|\[phrase:[^\]]*\]|\{[^}]*\})/g, match => {
      if (match.startsWith("[OMITTED")) return `<span class="kind-prose">${match}</span>`;
      if (match.startsWith("[UNSUPPORTED")) return `<span class="kind-error">${match}</span>`;
      if (match.startsWith("[it") || match.startsWith("[its") || match.startsWith("[the")) return `<span class="kind-anaphor">${match}</span>`;
      if (match.startsWith("[phrase")) return `<span class="kind-control">${match}</span>`;
      if (match.startsWith("[L")) return `<span class="kind-muted">${match}</span>`;
      return `<span class="kind-type">${match}</span>`;
    });
  } else if (kind === "trace") {
    safe = safe.replace(/\b(EXEC|COMMENT_OMITTED|UNSUPPORTED)\b/g, match =>
      match === "EXEC" ? `<span class="kind-ok">${match}</span>` :
      match === "UNSUPPORTED" ? `<span class="kind-error">${match}</span>` :
      `<span class="kind-prose">${match}</span>`);
    safe = safe.replace(/\b(wordnet|verbnet)=\S+/g, match => `<span class="kind-anaphor">${match}</span>`);
  } else if (kind === "ir") {
    safe = safe.replace(/\b(fn|struct|union|global|rodata|if|else|loop|return|syscall)\b/g, match => `<span class="kind-control">${match}</span>`);
    safe = safe.replace(/\b(i8|i16|i32|i64|u8|u16|u32|u64|f32|f64|bool|void|ptr)\b/g, match => `<span class="kind-type">${match}</span>`);
    safe = safe.replace(/\b\d+\b/g, match => `<span class="kind-number">${match}</span>`);
  }
  return safe;
}
function setBanner(text, ok) {
  el("banner").textContent = text;
  el("banner").className = "banner " + (ok ? "pass" : "fail");
}
async function action(name) {
  const source = el("editor").value;
  const body = { source, file_path: state.path || "", stdin: el("stdin").value };
  setStatus(`Running ${name}…`);
  try {
    const data = await postJson(`/api/${name}`, body);
    state.results[name] = data;
    state.errorLines = data.error_lines || [];
    state.omittedLines = data.omitted_lines || [];
    if (name === "paraphrase") state.omittedLines = data.omitted_lines || [];
    switchTab(name === "ir" ? "ir" : name);
    setBanner(`${data.ok ? "✓ PASS" : "✗ FAIL"} · ${data.summary}`, data.ok);
    setStatus(data.summary);
    scheduleHighlight();
  } catch (error) {
    setBanner(`✗ ERROR · ${error}`, false);
    setStatus("Request failed");
  }
}
function renderResult(name) {
  const data = state.results[name];
  if (!data) { el("output").innerHTML = `<div class="empty">No ${name} output yet.</div>`; return; }
  el("output").innerHTML = renderOutput(data.lines || [], name);
}
function switchTab(name) {
  state.tab = name;
  document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.tab === name));
  renderResult(name);
}
async function saveFile() {
  let path = state.path;
  if (!path) {
    path = prompt("Save as (.eng):", "demo.eng");
    if (!path) return;
  }
  const data = await postJson("/api/file/save", { path: path.split("/").pop(), content: el("editor").value });
  if (data.ok) { setPath(data.path); markDirty(false); setStatus(`Saved ${data.path}`); loadFiles(); }
  else setStatus(data.error || "Save failed");
}
async function openFile(path) {
  const data = await postJson("/api/file/open", { path });
  if (data.ok) {
    el("editor").value = data.content;
    setPath(data.path);
    markDirty(false);
    setStatus(`Opened ${data.path}`);
    scheduleHighlight();
    updatePosition();
  } else setStatus(data.error || "Open failed");
}
async function loadFiles() {
  const data = await getJson("/api/files");
  const list = el("file-list");
  list.innerHTML = (data.files || []).map(file => `<div class="file-item" data-file="${escapeHtml(file)}">${escapeHtml(file)}</div>`).join("") || `<div class="empty">No .eng files</div>`;
  list.querySelectorAll(".file-item").forEach(item => item.onclick = () => openFile(item.dataset.file));
}
async function loadPresets() {
  state.presets = await getJson("/api/presets");
  const select = el("preset-select");
  select.innerHTML = `<option value="">Presets…</option>` + state.presets.map((preset, index) => `<option value="${index}">${escapeHtml(preset.name)}</option>`).join("");
  el("preset-list").innerHTML = state.presets.map((preset, index) => `<div class="preset-item" data-preset="${index}">${escapeHtml(preset.name)}</div>`).join("");
  el("preset-list").querySelectorAll(".preset-item").forEach(item => item.onclick = () => loadPreset(Number(item.dataset.preset)));
  select.onchange = () => { if (select.value !== "") loadPreset(Number(select.value)); };
}
function loadPreset(index) {
  const preset = state.presets[index];
  if (!preset) return;
  el("editor").value = preset.source;
  state.path = null;
  setPath(null);
  markDirty(true);
  setStatus(`Loaded ${preset.name}`);
  scheduleHighlight();
  updatePosition();
}
async function loadStd() {
  const data = await getJson("/api/std");
  el("std-body").innerHTML = (data.modules || []).map(module =>
    `<div class="std-module"><h3>${escapeHtml(module.name)}</h3>` +
    module.functions.map(fn => `<div class="std-fn">${escapeHtml(fn.signature)}</div>` +
      (fn.phrases || []).map(phrase => `<div class="std-phrase">${escapeHtml(phrase)}</div>`).join("")).join("") +
    `</div>`).join("") || `<div class="empty">std/ not found</div>`;
}
function cycleTheme() {
  state.theme = (state.theme + 1) % themes.length;
  document.body.className = themes[state.theme];
  el("theme").textContent = `Theme: ${themeNames[state.theme]}`;
}
function insertAtCursor(text) {
  const editor = el("editor");
  const start = editor.selectionStart, end = editor.selectionEnd;
  editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
  editor.selectionStart = editor.selectionEnd = start + text.length;
  markDirty(true); scheduleHighlight(); updatePosition();
}
const editor = el("editor");
editor.addEventListener("input", () => { markDirty(true); scheduleHighlight(); updatePosition(); });
editor.addEventListener("scroll", () => { el("highlight").scrollTop = editor.scrollTop; el("highlight").scrollLeft = editor.scrollLeft; });
editor.addEventListener("click", updatePosition);
editor.addEventListener("keyup", updatePosition);
editor.addEventListener("keydown", event => {
  if (event.key === "Tab") { event.preventDefault(); insertAtCursor("    "); return; }
  if (event.key === "Enter" && !event.shiftKey) {
    const before = editor.value.slice(0, editor.selectionStart).split("\n").pop();
    const indent = (before.match(/^[ \t]*/) || [""])[0];
    const extra = before.trimEnd().endsWith(":") ? "    " : "";
    if (indent || extra) { event.preventDefault(); insertAtCursor("\n" + indent + extra); return; }
  }
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { event.preventDefault(); action("run"); }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") { event.preventDefault(); saveFile(); }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "b") { event.preventDefault(); action("build"); }
  if (event.altKey && event.key.toLowerCase() === "p") { event.preventDefault(); action("paraphrase"); }
  if (event.altKey && event.key.toLowerCase() === "t") { event.preventDefault(); action("trace"); }
  if (event.altKey && event.key.toLowerCase() === "i") { event.preventDefault(); action("ir"); }
});
el("run").onclick = () => action("run");
el("paraphrase").onclick = () => action("paraphrase");
el("trace").onclick = () => action("trace");
el("ir").onclick = () => action("ir");
el("build").onclick = () => action("build");
el("save").onclick = saveFile;
el("new").onclick = () => { el("editor").value = ""; state.path = null; setPath(null); markDirty(false); state.errorLines = []; state.omittedLines = []; el("output").textContent = ""; setBanner("Ready", true); setStatus("New .eng buffer"); scheduleHighlight(); updatePosition(); };
el("new-file").onclick = () => { const name = prompt("New .eng file:", "new.eng"); if (!name) return; el("editor").value = ""; setPath(name); markDirty(true); setStatus(`New ${name}`); scheduleHighlight(); };
el("refresh-files").onclick = loadFiles;
el("std-toggle").onclick = () => el("drawer").classList.toggle("open");
el("std-close").onclick = () => el("drawer").classList.remove("open");
el("theme").onclick = cycleTheme;
document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => switchTab(tab.dataset.tab));

(async function boot() {
  try {
    const health = await getJson("/api/health");
    setStatus(`${health.app} ${health.version} · ${health.workspace}`);
  } catch (_) { setStatus("Server unavailable"); }
  await loadPresets();
  await loadFiles();
  await loadStd();
  highlightNow();
  updatePosition();
})();
</script>
</body>
</html>
