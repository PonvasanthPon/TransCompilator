[package]
name = "tc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "End-to-end English build/run/interp/trace driver"

[lints]
workspace = true

[[bin]]
name = "tc"
path = "src/main.rs"

[dependencies]
tc-ir = { path = "../tc-ir" }
